<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="primaryBlueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accentAmberDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="512" height="512" rx="104" fill="url(#bgDark)" />
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Camera Lens Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="#1E293B" filter="url(#subtleGlow)" stroke="#334155" stroke-width="4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Dynamic Aperture Blades -->
  <g stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M 256 116 L 330 180" />
    <path d="M 376 196 L 376 290" />
    <path d="M 356 344 L 282 396" />
    <path d="M 256 396 L 182 332" />
    <path d="M 136 316 L 136 222" />
    <path d="M 156 168 L 230 116" />
  </g>

  <!-- Inner Focal Ring -->
  <circle cx="256" cy="256" r="92" fill="url(#primaryBlueDark)" />

  <!-- Human Silhouette (Believable, Natural Subject) -->
  <!-- Head -->
  <circle cx="256" cy="226" r="28" fill="#0F172A" />
  <!-- Shoulders & Torso -->
  <path d="M 204 316 C 204 274 230 268 256 268 C 282 268 308 274 308 316 Z" fill="#0F172A" />

  <!-- Golden Photography Focus Indicator / Lens Spark -->
  <circle cx="316" cy="196" r="8" fill="url(#accentAmberDark)" />
  <path d="M 316 182 L 316 210 M 302 196 L 330 196" stroke="url(#accentAmberDark)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Framing Marks -->
  <path d="M 146 166 L 166 166 M 146 166 L 146 186" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
  <path d="M 366 166 L 346 166 M 366 166 L 366 186" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
  <path d="M 146 346 L 166 346 M 146 346 L 146 326" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
  <path d="M 366 346 L 346 346 M 366 346 L 366 326" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
</svg>
