name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Bun Unit Tests
        run: |
          bun test

      - name: Verify CLI Execution
        run: |
          bun ./bin/cli.js --help
          bun ./bin/cli.js info
          bun ./bin/cli.js modes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Skill Structure & Integrity
        run: |
          python3 scripts/validate_skill.py .
