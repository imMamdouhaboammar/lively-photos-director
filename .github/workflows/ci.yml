name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Bun unit tests
        run: bun test

      - name: Verify CLI execution
        run: |
          bun ./bin/cli.js --help
          bun ./bin/cli.js info
          bun ./bin/cli.js modes
          bun ./bin/cli.js skills
          bun ./bin/cli.js route "Friend took this randomly from 12 meters away on a normal beach"
          bun ./bin/cli.js route "Use GPT Image 2.5 for a precision edit and preserve accepted details"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Skill contracts
        run: python3 scripts/validate_skill.py .

      - name: Validate Codex Plugin package contract
        run: python3 scripts/validate_plugin.py .

      - name: Build deterministic Plugin archive twice
        run: |
          rm -f /tmp/lively-photos-director-a.zip /tmp/lively-photos-director-b.zip
          python3 scripts/package_plugin.py . /tmp/lively-photos-director-a.zip
          python3 scripts/package_plugin.py . /tmp/lively-photos-director-b.zip
          cmp /tmp/lively-photos-director-a.zip /tmp/lively-photos-director-b.zip
          sha256sum /tmp/lively-photos-director-a.zip /tmp/lively-photos-director-b.zip

      - name: Validate a fresh extracted package
        run: |
          rm -rf /tmp/lively-photos-director-extracted
          mkdir -p /tmp/lively-photos-director-extracted
          unzip -q /tmp/lively-photos-director-a.zip -d /tmp/lively-photos-director-extracted
          python3 scripts/validate_plugin.py /tmp/lively-photos-director-extracted
